<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Classroom+ Chess</title><link rel="stylesheet" href="/static/chess.css?v=1"><script type="module" src="/static/chess-game.mjs?v=1"></script></head><body><main><header><div><p class="eyebrow">YOU FOUND THE EASTER EGG</p><h1>One more move<span>.</span></h1><p>Two players · Same laptop</p></div><span class="chess-emblem" aria-hidden="true">♞</span></header><div class="layout"><section><p id="status" role="status" aria-live="polite"></p><div id="board" class="board" role="group" aria-label="Chess board"></div><p class="hint">Choose a piece, then a highlighted square.</p></section><aside><div class="controls"><button id="undo">Undo move</button><button id="flip">Flip board</button><button id="new">New game</button></div><div id="reset-confirm" hidden><p>Start over and clear this game?</p><button id="reset-yes">Start over</button><button id="reset-no">Keep playing</button></div><section id="promotion" hidden><h2>Choose your promotion</h2><div class="promotion-options"><button data-piece="q">Queen</button><button data-piece="r">Rook</button><button data-piece="b">Bishop</button><button data-piece="n">Knight</button></div><button id="promotion-cancel">Cancel</button></section><h2>Moves</h2><ol id="moves" aria-label="Move history"></ol><p class="credit">Rules powered by <a href="https://github.com/jhlywa/chess.js" target="_blank" rel="noreferrer">chess.js</a></p></aside></div></main></body></html>
